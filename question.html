<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="question-container"></div>
    <button onclick="submitAnswers()">Submit Answers</button>
    <button onclick="clearAnswers()">Clear Answers</button>
    <button onclick="showResults()">Show Results</button>
    <div id="results-container"></div>

    <script>
        questions = [
            // ... (previous questions array remains unchanged)
        ];

        function loadQuestions() {
            var questionContainer = document.getElementById('question-container');
            questions.forEach(function (category) {
                var categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                var categoryTitle = document.createElement('h2');
                categoryTitle.textContent = category.category;
                categoryDiv.appendChild(categoryTitle);
                category.questions.forEach(function (question) {
                    var questionDiv = document.createElement('div');
                    questionDiv.className = 'question';
                    var questionText = document.createElement('p');
                    questionText.textContent = question.text;
                    questionDiv.appendChild(questionText);
                    question.options.forEach(function (option) {
                        var optionLabel = document.createElement('label');
                        var optionInput = document.createElement('input');
                        optionInput.type = 'radio';
                        optionInput.name = question.id;
                        optionInput.value = option;
                        optionLabel.appendChild(optionInput);
                        optionLabel.appendChild(document.createTextNode(option));
                        questionDiv.appendChild(optionLabel);
                    });
                    categoryDiv.appendChild(questionDiv);
                });
                questionContainer.appendChild(categoryDiv);
            });
        }

        loadQuestions();

        async function submitAnswers() {
            var answers = {};
            questions.forEach(function (category) {
                category.questions.forEach(function (question) {
                    var selectedOption = document.querySelector('input[name="' + question.id + '"]:checked');
                    if (selectedOption) {
                        answers[question.id] = selectedOption.value;
                    }
                });
            });

            try {
                const response = await fetch('http://127.0.0.1:5000/submit-answers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(answers)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Success:', data);
                alert('Answers submitted successfully!');
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting answers. Please try again.');
            }
        }

        function clearAnswers() {
            var inputs = document.querySelectorAll('input[type="radio"]');
            inputs.forEach(function (input) {
                input.checked = false;
            });
        }

        function showResults() {
            var resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '';
            questions.forEach(function (category) {
                var categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                var categoryTitle = document.createElement('h2');
                categoryTitle.textContent = category.category;
                categoryDiv.appendChild(categoryTitle);
                category.questions.forEach(function (question) {
                    var questionDiv = document.createElement('div');
                    questionDiv.className = 'question';
                    var questionText = document.createElement('p');
                    questionText.textContent = question.text;
                    questionDiv.appendChild(questionText);
                    var selectedOption = document.querySelector('input[name="' + question.id + '"]:checked');
                    var answerText = document.createElement('p');
                    answerText.textContent = 'Your answer: ' + (selectedOption ? selectedOption.value : 'Not answered');
                    questionDiv.appendChild(answerText);
                    categoryDiv.appendChild(questionDiv);
                });
                resultsContainer.appendChild(categoryDiv);
            });
        }
    </script>
</body>

</html>
